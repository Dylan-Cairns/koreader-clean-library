  <!-- spine strip -->
  <rect x="0" y="0" width="15" height="150" fill="#3c3c3c"/>
  <!-- cover block -->
  <rect x="27" y="26" width="56" height="33" rx="4" ry="4" fill="#ffffff"/>
  <!-- title rules -->
  <rect x="27" y="78" width="50" height="6" fill="#ffffff"/>
  <rect x="27" y="92" width="36" height="6" fill="#ffffff"/>
</svg>
